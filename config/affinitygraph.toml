[runtime]
mode = "observe"
sample_interval_seconds = 1
graph_horizon_seconds = 60
solve_interval_seconds = 1
minimum_confidence = 0.8
proposal_confirmations = 2
initial_proposal_confirmations = 1
minimum_dwell_seconds = 60
maximum_migrated_threads_ratio = 0.25
initial_migrated_threads_ratio = 1.0
collector_failure_restore_seconds = 30
solver = "incremental-hotspot-v1"
affinity_granularity = "singleton_cpu"
initial_node_passes = 1
candidate_multiplier = 1
candidate_hard_limit = 4
rotating_scan_size = 4
demand_dirty_threshold = 0.05
edge_dirty_absolute_threshold = 1.0
edge_dirty_relative_threshold = 0.10
minimum_relative_gain = 0.05
maximum_threads_per_cpu = 2
thread_slot_slack = 0
future_demand_floor = 0.02
maximum_managed_threads = 128
active_demand_threshold = 0.05
inactive_demand_threshold = 0.0
log_directory = "/var/log/affinitygraph"
socket_path = "/run/affinitygraph/control.sock"

[resources]
# Optional. CLI --cpus and AFFINITY_CPUS take precedence. If omitted, the
# process/cgroup affinity mask is discovered at startup.
calibration_path = "/etc/affinitygraph/calibration"

[collector]
required = true
pthread_uprobe = true

[calibration]
# Frozen ClickHouse scales from 20260723 gate2 fixed-v2. Other databases must
# replace the ID and all three scales with a reviewed offline calibration.
id = "clickhouse-gate2-fixed-v2"
activity_log_p95 = 2.4138804290562152
sync_log_p95 = 2.5591179487485345
share_log_p95 = 0.00894730347830295
