# YCSB 最终形态 workload 模板：read 0.90 + scan 0.10（ClickHouse 大表 + NUMA 探针）
#
# 用途: 配合 tests/run-ycsb-bench.sh 做正式 A/B（baseline / C / D 各 3 轮），
#       表为 tests/ch-bigtable-build.sh 生成的 ycsb.usertable_big。
#
# 叠加方式（EXTRA_YCSB_ARGS 原样拼到 ycsb 命令尾部）:
#   EXTRA_YCSB_ARGS="-P /home/xhc/affinitygraph/tests/workloads/clickhouse_numa_scan.properties -p recordcount=12000000" \
#     tests/run-ycsb-bench.sh --config tests/ycsb-bench.conf --clients 197 --rounds 3 --tag numa-scan
#
# 注意:
#   - zeropadding 必须为 19（YCSB 默认 1），否则键格式与表不一致，读取全部未命中
#     （ycsb run 不校验数据来源，缺失键计 OK，命中率会假性 100% 但不读任何数据）。
#   - requestdistribution=zipfian 集中在低键，低键全部存在（recordcount 与表行数一致）。
#   - scan 走 JDBC 传输（SELECT *），大 scanlength 时瓶颈在客户端传输/解析；此处
#     maxscanlength=1000 仅为形态保留，服务端成本以探针 Q2/Q3 为准。
readproportion=0.90
scanproportion=0.10
scanlengthdistribution=uniform
maxscanlength=1000
requestdistribution=zipfian
zeropadding=19
